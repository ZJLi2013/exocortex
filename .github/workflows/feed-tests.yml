name: feed-tests

on:
  pull_request:
    paths: ["feed/**", ".github/workflows/feed-tests.yml"]
  push:
    branches: [main]
    paths: ["feed/**", ".github/workflows/feed-tests.yml"]

jobs:
  feed-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: pytest -q
