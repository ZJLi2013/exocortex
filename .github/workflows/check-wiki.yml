name: check-wiki

on:
  pull_request:

jobs:
  check-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The expected count guards local ingests; CI only checks structure.
      - run: python scripts/check_wiki.py --sources "$(ls wiki/sources/*.md | wc -l)"
